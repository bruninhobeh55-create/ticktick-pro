<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>TickTick Pro — Precision Task, Calendar, Focus & Habit Workspace</title>
    <meta name="description" content="Precision Task, Calendar, Eisenhower Matrix, Pomodoro Focus & Habit Workspace" />
    
    <!-- PWA / Mobile Meta Tags -->
    <meta name="theme-color" content="#3b66f5" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="TickTick Pro" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Web App Manifest & App Icons -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="./app-icon.svg" />
    <link rel="alternate icon" type="image/png" href="./icon-192.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="antialiased selection:bg-zinc-900 selection:text-white bg-zinc-50 text-zinc-900">
    <div id="root">
      <!-- Instant Pre-Render Startup Splash for Mobile PWA & Web -->
      <style>
        .initial-splash {
          position: fixed;
          inset: 0;
          background-color: #09090b;
          color: #ffffff;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
          z-index: 99999;
          overflow: hidden;
        }
        .initial-glow {
          position: absolute;
          width: 320px;
          height: 320px;
          border-radius: 50%;
          background: radial-gradient(circle, rgba(59, 130, 246, 0.28) 0%, rgba(99, 102, 241, 0.12) 50%, transparent 70%);
          filter: blur(48px);
          animation: splashPulse 2s ease-in-out infinite;
        }
        .initial-icon-box {
          position: relative;
          width: 84px;
          height: 84px;
          border-radius: 24px;
          background: linear-gradient(135deg, #3b82f6 0%, #2563eb 50%, #4338ca 100%);
          box-shadow: 0 16px 36px -4px rgba(37, 99, 235, 0.4), inset 0 1px 1px rgba(255, 255, 255, 0.3);
          border: 1px solid rgba(255, 255, 255, 0.2);
          display: flex;
          align-items: center;
          justify-content: center;
          margin-bottom: 22px;
        }
        .initial-icon-box img {
          width: 54px;
          height: 54px;
        }
        .initial-title {
          font-size: 22px;
          font-weight: 700;
          letter-spacing: -0.025em;
          margin-bottom: 6px;
        }
        .initial-subtitle {
          font-size: 11px;
          color: #71717a;
          letter-spacing: 0.08em;
          text-transform: uppercase;
          font-weight: 600;
          margin-bottom: 32px;
        }
        .initial-bar-bg {
          width: 140px;
          height: 4px;
          background: rgba(255, 255, 255, 0.08);
          border-radius: 9999px;
          overflow: hidden;
        }
        .initial-bar-fill {
          height: 100%;
          width: 45%;
          background: linear-gradient(90deg, #3b82f6, #818cf8);
          border-radius: 9999px;
          animation: splashSlide 1.2s infinite ease-in-out;
        }
        @keyframes splashPulse {
          0%, 100% { transform: scale(1); opacity: 0.75; }
          50% { transform: scale(1.15); opacity: 1; }
        }
        @keyframes splashSlide {
          0% { transform: translateX(-100%); }
          100% { transform: translateX(230%); }
        }
      </style>
      <div class="initial-splash">
        <div class="initial-glow"></div>
        <div class="initial-icon-box">
          <img src="./app-icon.svg" alt="TickTick Pro" />
        </div>
        <div class="initial-title">TickTick Pro</div>
        <div class="initial-subtitle">Precision Workspace</div>
        <div class="initial-bar-bg">
          <div class="initial-bar-fill"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
